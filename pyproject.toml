[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mumu-mcp"
version = "2.0.0"
description = "MCP server for the Netease MuMu Player Android emulator: 63 tools over the MuMuManager CLI and ADB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Absurdity233" }]
keywords = ["mcp", "mumu", "mumu-player", "android", "emulator", "adb", "automation", "netease"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
]

dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
mumu-mcp = "mumu_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Absurdity233/mumu-mcp"
Issues = "https://github.com/Absurdity233/mumu-mcp/issues"

[tool.setuptools.packages.find]
include = ["mumu_mcp*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
